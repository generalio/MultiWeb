name: 发布 GitHub Packages 与 Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: 发布多平台组件
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出发布标签
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Android 编译平台
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 校验发布标签版本
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "发布标签必须为 vX.Y.Z，当前为：$TAG_NAME" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: 校验并发布 GitHub Packages 构件
        run: >-
          ./gradlew apiCheck publishAllPublicationsToGitHubPackagesRepository
          -PVERSION_NAME=${{ steps.version.outputs.value }}
          --no-parallel -Dorg.gradle.jvmargs=-Xmx2g

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
